apiVersion: apps/v1
kind: Deployment
metadata:
  name: etton-tools
  namespace: ns-wqw6rrmf
  labels:
    app: etton-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etton-tools
  template:
    metadata:
      labels:
        app: etton-tools
    spec:
      containers:
        - name: etton-tools
          image: ghcr.io/etton-ai/etton-tools:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          env:
            - name: NODE_ENV
              value: "production"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
