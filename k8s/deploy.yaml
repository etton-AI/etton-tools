apiVersion: apps/v1
kind: Deployment
metadata:
  name: etton-tools
  namespace: default
  labels:
    app: etton-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etton-tools
  template:
    metadata:
      labels:
        app: etton-tools
    spec:
      containers:
        - name: etton-tools
          image: ghcr.io/etton-ai/etton-tools:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          env:
            - name: NODE_ENV
              value: "production"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: etton-tools
  namespace: default
  labels:
    app: etton-tools
spec:
  type: ClusterIP
  selector:
    app: etton-tools
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etton-tools
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: vftnaopzqgqv.cloud.sealos.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: etton-tools
                port:
                  number: 3000
