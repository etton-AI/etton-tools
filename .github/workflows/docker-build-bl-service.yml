name: Build and Push BL Service Image

on:
  push:
    branches: [main]
    paths:
      - 'bl-service/**'
      - '.github/workflows/docker-build-bl-service.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: bl-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/etton-ai/etton-bl-service:latest
            ${{ env.REGISTRY }}/etton-ai/etton-bl-service:${{ steps.meta.outputs.tag }}
